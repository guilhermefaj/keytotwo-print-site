# Included in nginx's http context. Cache only successful, fingerprinted assets
# permanently; HTML and errors must never be cached.
map "$status:$uri" $site_cache_control {
    default "no-store";
    "~^(200|304):/assets/.*[-.][A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
    "~^(200|304):/media/" "public, max-age=3600, must-revalidate";
    "~^(200|304):/favicon\.ico$" "public, max-age=3600, must-revalidate";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /srv/keytotwo;
    index index.html;
    server_tokens off;
    autoindex off;
    absolute_redirect off;

    # TLS/HSTS belong to the VPS reverse proxy, not this HTTP-only container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $site_cache_control always;

    # Compressão de texto (HTML, CSS, JS, JSON, SVG): o JS e o CSS saíam sem gzip (Fase 4, Lighthouse).
    # Imagens WebP e fontes woff2 já são comprimidas e ficam de fora.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml application/rss+xml;

    error_page 404 /404/index.html;
    location = /404 { return 404; }
    location = /404/ { return 404; }
    location = /404/index.html { internal; }
    # O blog é escrito no admin (2026-10-23); o /admin do antigo CMS leva para lá.
    location ~ ^/admin(/.*)?$ { return 302 https://admin.keytotwo.com.br/blog; }
    # O painel da equipe mudou para o próprio subdomínio (admin/, 2026-10-23).
    location ~ ^/painel/?$ { return 302 https://admin.keytotwo.com.br/; }
    # URLs antigas dos produtos, com o código, levam às URLs com o nome (SEO, 2026-10-22).
    location ~ ^/loja/p001/?$ { return 301 /loja/colecao-fundadores; }
    location ~ ^/loja/j001/?$ { return 301 /loja/rabisque-e-adivinhe; }
    location ~ ^/loja/j002/?$ { return 301 /loja/o-sumico-de-rapadura; }
    location ~ ^/loja/j003/?$ { return 301 /loja/tabuleiro-da-sorte; }

    # Serve each prerendered route directly, including the private page shells.
    # Unknown URLs receive the prerendered 404 page, never the home/SPA HTML.
    location / {
        try_files $uri/index.html $uri =404;
    }

    # Versão do blog no ar (scripts/blog-export.mjs): o admin compara com a do banco para dizer se o site já atualizou.
    # Os add_header daqui substituem os do server, então os de segurança se repetem.
    location = /blog/versao.json {
        add_header Access-Control-Allow-Origin "https://admin.keytotwo.com.br" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /__spa-fallback.html { return 404; }
    location ~ /\. { return 404; }
}
