<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu código de acesso à KeyToTwo</title>
</head>
<body style="margin:0;padding:0;background:#f6f3ee;font-family:Arial,Helvetica,sans-serif;color:#2b2622;">
  <div style="max-width:480px;margin:0 auto;padding:32px 24px;">
    <p style="margin:0 0 24px;font-size:20px;font-weight:bold;">KeyToTwo</p>
    <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Seu código de acesso</h1>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Digite este código na página de entrada para acessar seus jogos:</p>
    <p style="margin:0 0 16px;font-size:32px;font-weight:bold;letter-spacing:6px;font-family:'Courier New',Courier,monospace;">{{ .Token }}</p>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#5c534b;">O código vale por 10 minutos e só pode ser usado uma vez.</p>
    <p style="margin:0 0 8px;font-size:14px;line-height:1.5;color:#5c534b;">Se você não pediu este código, ignore este e-mail. Ninguém entra na sua conta sem ele.</p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#5c534b;">Precisa de ajuda? <a href="{{ .SiteURL }}/ajuda" style="color:#2b2622;">{{ .SiteURL }}/ajuda</a></p>
  </div>
</body>
</html>
