name: CI

# Repositório público desde 2026-10-17 (minutos grátis); o foco é a espera. Em PR, cada commit roda uma vez e só os
# jobs que o diff afeta (o push da branch não dispara); no main e na execução manual roda tudo.
# Antes de abrir PR, `npm run verificar` repete o job Site na máquina.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Um commit novo no mesmo PR cancela a execução anterior; no main cada merge roda até o fim.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Em PR, os jobs de funções, banco e integração só rodam quando o diff toca o que eles testam; o Site roda sempre.
  # Para rodar tudo numa branch: `gh workflow run CI --ref <branch>`.
  changes:
    name: Arquivos alterados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      functions: ${{ steps.diff.outputs.functions }}
      database: ${{ steps.diff.outputs.database }}
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Decidir quais jobs rodam
        id: diff
        shell: bash
        env:
          FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          if [[ "$FULL" == true ]]; then
            for job in functions database integration; do echo "$job=true" >> "$GITHUB_OUTPUT"; done
            echo "Tudo roda: main ou execução manual."
            exit 0
          fi
          # O checkout de um PR é o merge com a base; o primeiro pai é a base, então o diff é só o do PR.
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          shared='^(\.github/|package(-lock)?\.json$)'
          {
            echo "functions=$(has "^supabase/functions/|$shared")"
            echo "database=$(has "^supabase/(migrations|tests|seed\.sql|config\.toml)|$shared")"
            echo "integration=$(has "^supabase/|^src/lib/|^tests/e2e/(i[0-9]|smoke)|^playwright\.config\.ts$|$shared")"
          } | tee -a "$GITHUB_OUTPUT"

  site:
    name: Site (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Fixtures do bloqueio de release
        run: node scripts/check-release.mjs --self-test
      - name: Testes unitários do blog
        run: npm run test:unit
      - name: Build pré-renderizado (o script de build já roda o typecheck)
        run: npm run build
      - name: Build do admin (o Playwright também serve admin/dist)
        # Sem URL, o admin abre a tela de "não configurado". A local só dá o nome da sessão (sb-127-auth-token, o mesmo
        # dos testes); Auth e API são simulados nos specs.
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build:admin
      - name: Validar conteúdo e preço para release
        run: node scripts/check-release.mjs --built
      - name: Instalar o Chromium do Playwright
        # O playwright.config.ts só tem o projeto chromium.
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        # Este build não tem API, então mais workers não esbarram nos limites do Auth. O runner de repositório público tem 4 vCPU.
        run: npm run test:e2e -- --workers=4

  functions:
    name: Funções (Deno 2.9.x)
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 'v2.9.x'
      - name: Deno check
        working-directory: supabase/functions
        run: deno check .
      - name: Testes unitários e de contrato (sem integração)
        working-directory: supabase/functions
        run: env -u KT_INTEGRATION deno test --no-lock --allow-env tests/

  database:
    name: Banco (Supabase CLI 2.118.0 / pgTAP)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only satisfy the local config; OAuth is not exercised by database tests.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Iniciar só o banco e o Auth
        # O pgTAP só precisa do Postgres; o Auth fica porque as migrações e os testes usam o esquema auth.
        # Avoid printing the local stack's generated API keys.
        run: npx --yes supabase@2.118.0 start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /dev/null
      - name: Testes de banco pgTAP
        run: npx --yes supabase@2.118.0 test db

  # Desenvolvimento usa o Supabase hospedado (sem Docker na máquina). Os testes que precisam de Auth, Mailpit,
  # banco e funções locais rodam aqui, numa stack efêmera do runner com o seed de TESTE. São dois jobs em paralelo,
  # cada um com a sua stack (.github/actions/stack-efemera): funções e GoTrue num, e2e do site no outro.
  # O runner é descartado no fim, então não há passo de parar a stack.
  integration-functions:
    name: Integração das funções (stack efêmera)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only satisfy the local config; OAuth is not exercised here.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 'v2.9.x'
      - uses: ./.github/actions/stack-efemera
        with:
          b2-read-key-id: ${{ secrets.B2_TEST_READ_KEY_ID }}
          b2-read-application-key: ${{ secrets.B2_TEST_READ_APPLICATION_KEY }}
      - name: Integração das funções (Deno)
        run: deno task --config supabase/functions/deno.json test:integration
      - name: Trigger de senha com o GoTrue real
        run: node supabase/tests/gotrue/trigger-senha.mjs
      - name: Log das funções
        if: failure()
        run: tail -100 "$RUNNER_TEMP/functions-serve.log"

  integration:
    name: Integração do site (stack efêmera, Auth e Mailpit reais)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Only satisfy the local config; OAuth is not exercised here.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - uses: ./.github/actions/stack-efemera
        with:
          b2-read-key-id: ${{ secrets.B2_TEST_READ_KEY_ID }}
          b2-read-application-key: ${{ secrets.B2_TEST_READ_APPLICATION_KEY }}
      - name: Build stage=test ligado à stack efêmera
        env:
          VITE_SITE_STAGE: test
          # Como o .env.local de desenvolvimento: checkout Stripe. Os specs trocam o Stripe.js por um stub; a chave é fictícia.
          VITE_CHECKOUT_MODE: stripe
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" npm run build
      - name: Build do admin (o Playwright também serve admin/dist)
        run: VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" npm run build:admin
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E com Auth, Mailpit e API locais (inclui I2b)
        # Workers padrão: com Auth real, mais paralelismo esbarra nos limites de login do config.toml.
        env:
          I2B_LOCAL_QA: '1'
        run: VITE_SUPABASE_URL="$API_URL" npm run test:e2e
      - name: Log das funções
        if: failure()
        run: tail -100 "$RUNNER_TEMP/functions-serve.log"
