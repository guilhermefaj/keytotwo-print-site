# Admin (admin.keytotwo.com.br): SPA estático. Toda rota desconhecida devolve o index.html (o roteamento é no
# navegador). Fora da busca, sem moldura e com CSP fechado: só o próprio domínio e o Supabase.
map "$status:$uri" $admin_cache_control {
    default "no-store";
    "~^(200|304):/assets/.*[-.][A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /srv/admin;
    index index.html;
    server_tokens off;
    autoindex off;
    absolute_redirect off;

    # TLS/HSTS ficam no Traefik da VPS, não neste contêiner HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $admin_cache_control always;
    # img-src data:: o QR code do app autenticador vem do Supabase como data URL. O React muda estilos pelo CSSOM,
    # que o style-src não barra.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { try_files $uri /index.html; }
    location ~ /\. { return 404; }
}
